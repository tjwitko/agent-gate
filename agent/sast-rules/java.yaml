# Injection rules for Java, written for agent-gate. See python.yaml for the split between blocking
# taint rules (ERROR) and advisory pattern rules (WARNING).
rules:
  - id: java-command-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: request data reaches a shell command
    metadata: { category: command injection }
    pattern-sources:
      # Servlet API.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getParameterValues(...)
          - pattern: (HttpServletRequest $R).getParameterMap()
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
          - pattern: (HttpServletRequest $R).getInputStream()
          - pattern: (HttpServletRequest $R).getReader()
          - pattern: (HttpServletRequest $R).getCookies()
      # Spring MVC: a handler's annotated parameters are request data.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader(...) $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      # exec(String) splits the string itself, so whatever builds it chooses the program and its
      # arguments. exec(String[]) of fixed words with request data as one element starts no shell
      # and is not this.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($CMD, ...)
              - pattern: (Runtime $RT).exec($CMD, ...)
          - pattern-not: Runtime.getRuntime().exec(new $T[]{...}, ...)
          - pattern-not: (Runtime $RT).exec(new $T[]{...}, ...)
          - pattern-not: Runtime.getRuntime().exec((String[] $A), ...)
          - pattern-not: (Runtime $RT).exec((String[] $A), ...)
          - focus-metavariable: $CMD
      # An explicit shell, by array or by ProcessBuilder.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec(new String[]{$SH, $FLAG, $CMD, ...}, ...)
              - pattern: (Runtime $RT).exec(new String[]{$SH, $FLAG, $CMD, ...}, ...)
              - pattern: new ProcessBuilder($SH, $FLAG, $CMD, ...)
          - metavariable-regex:
              metavariable: $SH
              regex: ^"(sh|bash|/bin/sh|/bin/bash|cmd|cmd\.exe)"$
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^"(-c|/c)"$
          - focus-metavariable: $CMD

  - id: java-sql-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: request data is built into a SQL statement
    metadata: { category: SQL injection }
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getParameterValues(...)
          - pattern: (HttpServletRequest $R).getParameterMap()
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
          - pattern: (HttpServletRequest $R).getInputStream()
          - pattern: (HttpServletRequest $R).getReader()
          - pattern: (HttpServletRequest $R).getCookies()
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader(...) $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Statement $S).executeQuery($Q)
              - pattern: (java.sql.Statement $S).executeUpdate($Q, ...)
              - pattern: (java.sql.Statement $S).execute($Q, ...)
              - pattern: (java.sql.Statement $S).addBatch($Q)
              - pattern: (java.sql.Connection $C).prepareStatement($Q, ...)
              - pattern: (java.sql.Connection $C).prepareCall($Q, ...)
              - pattern: (JdbcTemplate $J).$METHOD($Q, ...)
              - pattern: (NamedParameterJdbcTemplate $J).$METHOD($Q, ...)
              - pattern: (EntityManager $E).createQuery($Q, ...)
              - pattern: (EntityManager $E).createNativeQuery($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: UUID.fromString(...)

  - id: java-code-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: request data is evaluated as code
    metadata: { category: code injection }
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (javax.script.ScriptEngine $E).eval($X, ...)
              - pattern: (ScriptEngine $E).eval($X, ...)
              - pattern: (ExpressionParser $P).parseExpression($X, ...)
              - pattern: (SpelExpressionParser $P).parseExpression($X, ...)
          - focus-metavariable: $X

  - id: java-sql-string-built
    languages: [java]
    severity: WARNING
    message: a SQL statement is built by string concatenation rather than passed parameters
    metadata: { category: SQL injection }
    patterns:
      - pattern-either:
          - pattern: (java.sql.Statement $S).$M("..." + $X, ...)
          - pattern: (java.sql.Statement $S).$M($X + "...", ...)
          - pattern: (java.sql.Statement $S).$M(String.format(...), ...)
          - pattern: (java.sql.Connection $C).$M("..." + $X, ...)
          - pattern: (java.sql.Connection $C).$M($X + "...", ...)
          - pattern: (JdbcTemplate $J).$M("..." + $X, ...)
          - pattern: (JdbcTemplate $J).$M($X + "...", ...)
          - pattern: (JdbcTemplate $J).$M(String.format(...), ...)
          - pattern: (EntityManager $E).$M("..." + $X, ...)
          - pattern: (EntityManager $E).$M($X + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(executeQuery|executeUpdate|execute|addBatch|prepareStatement|prepareCall|query|queryForObject|queryForList|queryForMap|update|batchUpdate|createQuery|createNativeQuery)$

  - id: java-shell-nonliteral
    languages: [java]
    severity: WARNING
    message: a shell command is built from a value that is not a literal
    metadata: { category: command injection }
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: Runtime.getRuntime().exec($CMD, ...)
                  - pattern: (Runtime $RT).exec($CMD, ...)
              - pattern-not: Runtime.getRuntime().exec(new $T[]{...}, ...)
              - pattern-not: (Runtime $RT).exec(new $T[]{...}, ...)
              - pattern-not: Runtime.getRuntime().exec((String[] $A), ...)
              - pattern-not: (Runtime $RT).exec((String[] $A), ...)
              - metavariable-pattern:
                  metavariable: $CMD
                  patterns:
                    - pattern: $X
                    - pattern-not: '"..."'
          - patterns:
              - pattern-either:
                  - pattern: Runtime.getRuntime().exec(new String[]{$SH, $FLAG, $CMD, ...}, ...)
                  - pattern: (Runtime $RT).exec(new String[]{$SH, $FLAG, $CMD, ...}, ...)
                  - pattern: new ProcessBuilder($SH, $FLAG, $CMD, ...)
              - metavariable-regex:
                  metavariable: $SH
                  regex: ^"(sh|bash|/bin/sh|/bin/bash|cmd|cmd\.exe)"$
              - metavariable-regex:
                  metavariable: $FLAG
                  regex: ^"(-c|/c)"$
              - metavariable-pattern:
                  metavariable: $CMD
                  patterns:
                    - pattern: $X
                    - pattern-not: '"..."'
      - focus-metavariable: $CMD

  # Request data that crosses a call is not followed by the taint rules, and a query is often built
  # into a variable in one method and executed in another -- WebGoat's lessons pass a parameter
  # through two helpers this way. So SQL text built by concatenation is reported where it is built,
  # recognised by its shape rather than by the call that runs it.
  - id: java-sql-text-built
    languages: [java]
    severity: WARNING
    message: SQL text is built by concatenation, wherever it is later executed
    metadata: { category: SQL injection }
    pattern-either:
      - patterns:
          - pattern: '"$SQL" + $X'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)
          # Appending a literal -- a placeholder clause like ' AND provider_id = $2' -- builds nothing
          # from a value. webhook-haiku's parameterised query matched until this was added.
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern: $Y
                - pattern-not: '"..."'
      - patterns:
          - pattern: String.format("$SQL", ...)
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)

  # A credential assembled from literals is still in the source, just not as one string, so
  # gitleaks -- which reads literals -- does not see it. Matched by the shape of the assembly and the
  # name it is assigned to; the name has to END like a credential, so TOKEN_URL and password_field
  # are left alone. Blocks: every piece of the value is written in the file. Each assignment form is
  # spelled out with each shape, because Semgrep would not match the shapes as sub-patterns of a
  # bound value. The name pattern starts with `.*?` because metavariable-regex anchors at the START:
  # without it only names beginning with a credential word matched, which looked like the shapes failing.
  - id: java-assembled-credential
    languages: [java]
    severity: ERROR
    message: a credential is assembled from literals in the source
    metadata: { category: hardcoded credential }
    # Only literals as written. With constant propagation a variable holding a test password, plus
    # ' this makes the password wrong', counted as two literals: Juice Shop's 2FA test matched.
    options:
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: '$T $V = "$A" + "$B";'
          - pattern: '$T $V = "$A" + "$B" + "$C";'
          - pattern: '$T $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: '$T $V = String.join($SEP, "$A", ...);'
          - pattern: '$T $V = <... Base64.getDecoder().decode("$A") ...>;'
          - pattern: '$T $V = <... java.util.Base64.getDecoder().decode("$A") ...>;'
          - pattern: '$T $V = new StringBuilder("$A").reverse().toString();'
          - pattern: '$V = "$A" + "$B";'
          - pattern: '$V = "$A" + "$B" + "$C";'
          - pattern: '$V = "$A" + "$B" + "$C" + "$D";'
          - pattern: '$V = String.join($SEP, "$A", ...);'
          - pattern: '$V = <... Base64.getDecoder().decode("$A") ...>;'
          - pattern: '$V = <... java.util.Base64.getDecoder().decode("$A") ...>;'
          - pattern: '$V = new StringBuilder("$A").reverse().toString();'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^.*?(api_?key|access_?key|secret(_?key)?|signing_?key|private_?key|token|passw(or)?d|pwd|passphrase|credentials?)$
      # A credential has no whitespace; prose does. The remedy text for this very category -- a key named
      # "hardcoded credential" holding two concatenated sentences -- matched until this was added.
      - metavariable-regex:
          metavariable: $V
          regex: ^\S+$
      - pattern-not-regex: (["'])[^"'\n]*\s[^"'\n]*\1\s*\+|\+\s*(["'])[^"'\n]*\s[^"'\n]*\2

  # SSRF: request data choosing where the server connects. A fixed scheme and host with request data
  # only after the first path slash cannot be redirected, so that construction is a sanitizer.
  - id: java-ssrf
    mode: taint
    languages: [java]
    severity: ERROR
    message: request data chooses where the server sends a request
    metadata: { category: SSRF }
    pattern-sources:
      # Servlet API.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getParameterValues(...)
          - pattern: (HttpServletRequest $R).getParameterMap()
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
          - pattern: (HttpServletRequest $R).getInputStream()
          - pattern: (HttpServletRequest $R).getReader()
          - pattern: (HttpServletRequest $R).getCookies()
      # Spring MVC: a handler's annotated parameters are request data.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader(...) $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      # The request, not the URL. Building a URI from request data is how a redirect is validated or
      # issued -- WebGoat's open-redirect lessons do exactly that -- and connects to nothing. A URL
      # object built from request data stays tainted, so the call that opens it is the sink.
      - patterns:
          - pattern-either:
              - pattern: $U.openConnection(...)
              - pattern: $U.openStream()
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: WebClient.create($URL)
              - pattern: (RestTemplate $R).$M($URL, ...)
              - pattern: HttpRequest.newBuilder($URL)
              - pattern: HttpRequest.newBuilder().uri($URL)
              - pattern: Jsoup.connect($URL)
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: '"$P" + $X'
              - pattern: String.format("$P", ...)
          - metavariable-regex:
              metavariable: $P
              regex: ^https?://[^/%]+/

  # Path traversal: request data naming a file the server opens, writes or deletes. Paths.get(a, b)
  # and new File(dir, name) do not stop "../"; taking only the file name does.
  - id: java-path-traversal
    mode: taint
    languages: [java]
    severity: ERROR
    message: request data names a file the server reads, writes or deletes
    metadata: { category: path traversal }
    pattern-sources:
      # Servlet API.
      - pattern-either:
          - pattern: (HttpServletRequest $R).getParameter(...)
          - pattern: (HttpServletRequest $R).getParameterValues(...)
          - pattern: (HttpServletRequest $R).getParameterMap()
          - pattern: (HttpServletRequest $R).getHeader(...)
          - pattern: (HttpServletRequest $R).getQueryString()
          - pattern: (HttpServletRequest $R).getInputStream()
          - pattern: (HttpServletRequest $R).getReader()
          - pattern: (HttpServletRequest $R).getCookies()
      # Spring MVC: a handler's annotated parameters are request data.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader(...) $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new File($P)
              - pattern: new File($D, $P)
              - pattern: new java.io.File($P)
              - pattern: Paths.get($P, ...)
              - pattern: Paths.get($D, $P, ...)
              - pattern: Path.of($P, ...)
              - pattern: Path.of($D, $P, ...)
              - pattern: new FileInputStream($P)
              - pattern: new FileOutputStream($P, ...)
              - pattern: new FileReader($P, ...)
              - pattern: new FileWriter($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: FilenameUtils.getName(...)
      - pattern: $X.getFileName()
      - pattern: Integer.parseInt(...)
      - pattern: UUID.fromString(...)

  # XXE: Java's XML factories resolve external entities unless told not to, so the advisory is a
  # factory created without being hardened in the same method.
  - id: java-xxe
    languages: [java]
    severity: WARNING
    message: an XML parser factory is created without disabling external entities
    metadata: { category: XXE }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $T $F = DocumentBuilderFactory.newInstance();
              - pattern: $F = DocumentBuilderFactory.newInstance();
          - pattern-not-inside: |
              $T $F = DocumentBuilderFactory.newInstance();
              ...
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          - pattern-not-inside: |
              $T $F = DocumentBuilderFactory.newInstance();
              ...
              $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
          - pattern-not-inside: |
              $F = DocumentBuilderFactory.newInstance();
              ...
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          - pattern-not-inside: |
              $F = DocumentBuilderFactory.newInstance();
              ...
              $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
      - patterns:
          - pattern-either:
              - pattern: $T $F = SAXParserFactory.newInstance();
              - pattern: $F = SAXParserFactory.newInstance();
          - pattern-not-inside: |
              $T $F = SAXParserFactory.newInstance();
              ...
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
          - pattern-not-inside: |
              $F = SAXParserFactory.newInstance();
              ...
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
      - patterns:
          - pattern-either:
              - pattern: $T $F = XMLInputFactory.newInstance();
              - pattern: $F = XMLInputFactory.newInstance();
          - pattern-not-inside: |
              $T $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty(XMLInputFactory.SUPPORT_DTD, false);
          - pattern-not-inside: |
              $T $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty("javax.xml.stream.supportDTD", false);
          - pattern-not-inside: |
              $T $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
          - pattern-not-inside: |
              $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty(XMLInputFactory.SUPPORT_DTD, false);
          - pattern-not-inside: |
              $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty("javax.xml.stream.supportDTD", false);
          - pattern-not-inside: |
              $F = XMLInputFactory.newInstance();
              ...
              $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
