# This repository running its own gate, plus the regression corpus.
#
# The gate is the product; the corpus is what stops the gate rotting. Every control defect in this
# project's history was found by running real work through the controls, not by unit tests, so the
# corpus runs here alongside them.
name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A matrix because one Node version hid a defect in the product's own output for a month.
        # `node --test` emits the spec format to a TTY and TAP to a pipe, and this code always reads
        # a pipe -- so the format depends on the Node version. 22 emits TAP, 26 emits spec, the
        # development machine runs 26, and the failing-test-name parser only knew spec. On CI the
        # gate printed "1 of 2 test(s) FAILED" followed by a sentence telling the reader to check
        # the names above, with no names above.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test

  corpus:
    name: regression corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/control-tooling
      # One provider download per job instead of one per fixture. `terraform init` runs once for
      # every Terraform root across eleven deliverables, and the AWS provider is not small.
      - name: terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('corpus/fixtures.tar.gz') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      # The fixtures ship in the repository as corpus/fixtures.tar.gz, so this job needs nothing
      # beside the checkout. It does NOT pass when they are absent. The first version of it did --
      # `exit 0` with a warning -- which is a job reporting green while verifying nothing, in the
      # workflow of a project whose entire subject is gates that do that. The corpus exits 3 when it
      # cannot find its fixtures, distinct from exit 1 for drift, and both are surfaced distinctly
      # here for the same reason the gate distinguishes them.
      - name: corpus
        run: |
          set +e
          npm run corpus
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice title=corpus::all fixtures match" ;;
            3) echo "::error title=corpus: DID NOT RUN::The fixtures are not present, so nothing was verified. Set CORPUS_FIXTURES or check them out beside this repository." ;;
            *) echo "::error title=corpus: drift::A control changed behaviour against a frozen deliverable." ;;
          esac
          exit $CODE

  action:
    name: the action, against fixtures with known verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/control-tooling
      - name: terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('corpus/fixtures.tar.gz') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      # Fixtures with verdicts frozen in corpus/manifest.json, so this asserts the action's
      # behaviour rather than merely running it. The earlier version of this job pointed the gate at
      # this repository, which reported four blocking findings -- every one of them inside bench/,
      # where the fixtures are deliberately imperfect because that is what proves the rules fire.
      # A tool is not a webhook receiver, and gating it as though it were is theatre that would have
      # made this workflow red from its first run.
      - name: unpack fixtures
        run: |
          mkdir -p "${RUNNER_TEMP}/fixtures"
          tar -xzf corpus/fixtures.tar.gz -C "${RUNNER_TEMP}/fixtures"
          # The uncommitted_work validator reads git state, so each fixture needs a repository with
          # everything committed -- which is why the archive carries none.
          for d in "${RUNNER_TEMP}/fixtures"/*/; do
            git -C "$d" init -q
            git -C "$d" add -A
            git -C "$d" -c user.name=ci -c user.email=ci@localhost commit -qm "fixture"
          done

      - id: clean
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt

      - id: blocked
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-haiku-3
          task-file: agent/fixtures/webhook-receiver-task.txt

      # Exit 3 is the outcome this whole contract exists to keep distinct from exit 1, so it is
      # asserted rather than assumed. Pointing a control at a path that does not exist is the
      # cheapest way to produce it.
      - id: incomplete
        continue-on-error: true
        uses: ./
        with:
          project: ${{ runner.temp }}/fixtures/webhook-sonnet-2
          task-file: agent/fixtures/webhook-receiver-task.txt
          terraform-guard: /nonexistent/server.mjs

      - name: assert
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "  ok   $1 -> $2"; else echo "  FAIL $1 -> got '$2', want '$3'"; fail=1; fi
          }
          check "clean fixture"        "${{ steps.clean.outputs.outcome }}"      "clean"
          check "blocked fixture"      "${{ steps.blocked.outputs.outcome }}"    "blocked"
          check "unreachable control"  "${{ steps.incomplete.outputs.outcome }}" "incomplete"
          # A blocked run and an incomplete run must not report the same thing. That confusion is the
          # silent pass this control set exists to remove, and at CI scale it is invisible.
          if [ "${{ steps.blocked.outputs.outcome }}" = "${{ steps.incomplete.outputs.outcome }}" ]; then
            echo "  FAIL blocked and incomplete reported identically"
            fail=1
          fi
          exit $fail
