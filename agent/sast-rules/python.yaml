# Injection rules for Python, written for agent-gate. Taint rules (ERROR) block: they fire only when
# data from an HTTP request reaches a shell, a SQL string or an evaluator. Pattern rules (WARNING) are
# advisories: they see the dangerous construction without knowing where its input came from.
rules:
  - id: python-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: request data reaches a shell command
    metadata: { category: command injection }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.query_params
          - pattern: request.path_params
      # FastAPI: a route handler's parameters are request data.
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: subprocess.getoutput($CMD)
              - pattern: subprocess.getstatusoutput($CMD)
          - focus-metavariable: $CMD

  - id: python-sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: request data is built into a SQL statement
    metadata: { category: SQL injection }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.query_params
          - pattern: request.path_params
      # FastAPI: a route handler's parameters are request data.
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $CUR.executescript($Q)
              - pattern: sqlalchemy.text($Q)
              - pattern: text($Q)
              - pattern: $M.objects.raw($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)

  - id: python-code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: request data is evaluated as code
    metadata: { category: code injection }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.query_params
          - pattern: request.path_params
      # FastAPI: a route handler's parameters are request data.
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: pickle.loads($X, ...)
              - pattern: yaml.load($X)
              - pattern: yaml.unsafe_load($X)
          - focus-metavariable: $X

  - id: python-sql-string-built
    languages: [python]
    severity: WARNING
    message: a SQL statement is built by string formatting rather than passed parameters
    metadata: { category: SQL injection }
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.execute("..." % $X, ...)
          - pattern: $CUR.execute("...".format(...), ...)
          - pattern: $CUR.execute("..." + $X, ...)
          # `"a" + x + "b"` is `("a" + x) + "b"`: the literal is on the right of the outer `+`.
          - pattern: $CUR.execute($X + "...", ...)
          - pattern: text(f"...")
          - pattern: text("..." + $X)
          - pattern: text($X + "...")

  - id: python-shell-nonliteral
    languages: [python]
    severity: WARNING
    message: a shell command is built from a value that is not a literal
    metadata: { category: command injection }
    patterns:
      - pattern-either:
          - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
      - pattern-not: subprocess.$FN("...", ..., shell=True, ...)
      - pattern-not: os.system("...")

  # Request data that crosses a call is not followed by the taint rules, and a query is often built
  # into a variable in one function and executed in another (WebGoat's SQL lessons do exactly this).
  # So SQL text built from a value is reported where it is built, recognised by its shape rather than
  # by the call that runs it. See java.yaml's java-sql-text-built.
  - id: python-sql-text-built
    languages: [python]
    severity: WARNING
    message: SQL text is built from a value, wherever it is later executed
    metadata: { category: SQL injection }
    pattern-either:
      - patterns:
          - pattern: '"$SQL" + $X'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)
          # Appending a literal -- a placeholder clause like ' AND provider_id = $2' -- builds nothing
          # from a value. webhook-haiku's parameterised query matched until this was added.
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern: $Y
                - pattern-not: '"..."'
      - patterns:
          - pattern-either:
              - pattern: '"$SQL" % $X'
              - pattern: '"$SQL".format(...)'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)
      # f-strings do not bind their text to a metavariable, so they are matched as text. The quote is
      # captured so a single quote inside a double-quoted f-string, as in `= '{name}'`, does not end it.
      - patterns:
          - pattern-regex: (?is)\b[rR]?[fF][rR]?("""|'''|"|')\s*(?:select\s(?:(?!\1).)*?\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)(?:(?!\1).)*?\{
          - pattern-not-regex: (?m)^[ \t]*#.*$

  # A credential assembled from literals is still in the source, just not as one string, so
  # gitleaks -- which reads literals -- does not see it. Matched by the shape of the assembly and the
  # name it is assigned to; the name has to END like a credential, so TOKEN_URL and password_field
  # are left alone. Blocks: every piece of the value is written in the file. Each assignment form is
  # spelled out with each shape, because Semgrep would not match the shapes as sub-patterns of a
  # bound value. The name pattern starts with `.*?` because metavariable-regex anchors at the START:
  # without it only names beginning with a credential word matched, which looked like the shapes failing.
  - id: python-assembled-credential
    languages: [python]
    severity: ERROR
    message: a credential is assembled from literals in the source
    metadata: { category: hardcoded credential }
    # Only literals as written. With constant propagation a variable holding a test password, plus
    # ' this makes the password wrong', counted as two literals: Juice Shop's 2FA test matched.
    options:
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: '$V = "$A" + "$B"'
          - pattern: '$V = "$A" + "$B" + "$C"'
          - pattern: '$V = "$A" + "$B" + "$C" + "$D"'
          - pattern: '$V = "".join([...])'
          - pattern: '$V = <... base64.b64decode("$A") ...>'
          - pattern: '$V = <... base64.urlsafe_b64decode("$A") ...>'
          - pattern: '$V = <... bytes.fromhex("$A") ...>'
          - pattern: '$V = "$A"[::-1]'
          - pattern: '$F(..., $V="$A" + "$B", ...)'
          - pattern: '$F(..., $V="$A" + "$B" + "$C", ...)'
          - pattern: '$F(..., $V="$A" + "$B" + "$C" + "$D", ...)'
          - pattern: '$F(..., $V="".join([...]), ...)'
          - pattern: '$F(..., $V=<... base64.b64decode("$A") ...>, ...)'
          - pattern: '$F(..., $V=<... base64.urlsafe_b64decode("$A") ...>, ...)'
          - pattern: '$F(..., $V=<... bytes.fromhex("$A") ...>, ...)'
          - pattern: '$F(..., $V="$A"[::-1], ...)'
          - pattern: '{..., "$V": "$A" + "$B", ...}'
          - pattern: '{..., "$V": "$A" + "$B" + "$C", ...}'
          - pattern: '{..., "$V": "$A" + "$B" + "$C" + "$D", ...}'
          - pattern: '{..., "$V": "".join([...]), ...}'
          - pattern: '{..., "$V": <... base64.b64decode("$A") ...>, ...}'
          - pattern: '{..., "$V": <... base64.urlsafe_b64decode("$A") ...>, ...}'
          - pattern: '{..., "$V": <... bytes.fromhex("$A") ...>, ...}'
          - pattern: '{..., "$V": "$A"[::-1], ...}'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^.*?(api_?key|access_?key|secret(_?key)?|signing_?key|private_?key|token|passw(or)?d|pwd|passphrase|credentials?)$
      # A credential has no whitespace; prose does. The remedy text for this very category -- a key named
      # "hardcoded credential" holding two concatenated sentences -- matched until this was added.
      - metavariable-regex:
          metavariable: $V
          regex: ^\S+$
      - pattern-not-regex: (["'])[^"'\n]*\s[^"'\n]*\1\s*\+|\+\s*(["'])[^"'\n]*\s[^"'\n]*\2

  # SSRF: request data choosing where the server connects. A URL whose scheme and host are fixed
  # literals, with request data only after the first path slash, cannot be pointed anywhere else, so
  # that construction is a sanitizer -- requests.get("https://api.example.com/users/" + id) is not this.
  - id: python-ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: request data chooses where the server sends a request
    metadata: { category: SSRF }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.query_params
          - pattern: request.path_params
      # FastAPI: a route handler's parameters are request data.
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: requests.request($METHOD, $URL, ...)
              - pattern: httpx.$M($URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - pattern: urlopen($URL, ...)
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: '"$P" + $X'
              - pattern: '"$P".format(...)'
              - pattern: '"$P" % $X'
          - metavariable-regex:
              metavariable: $P
              regex: ^https?://[^/{}%]+/
      - pattern-regex: \b[rR]?[fF][rR]?["']https?://[^/{"']+/[^"']*["']

  # Path traversal: request data naming a file the server opens, sends, writes or deletes.
  # os.path.join does not help -- an absolute second argument replaces the first -- so it is not a
  # sanitizer; basename and secure_filename are. send_from_directory checks the result and is safe.
  - id: python-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: request data names a file the server reads, writes or deletes
    metadata: { category: path traversal }
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.query_params
          - pattern: request.path_params
      # FastAPI: a route handler's parameters are request data.
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(..., $P, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: io.open($P, ...)
              - pattern: pathlib.Path($P, ...)
              - pattern: Path($P, ...)
              - pattern: os.remove($P)
              - pattern: os.unlink($P)
              - pattern: shutil.rmtree($P, ...)
              - pattern: send_file($P, ...)
              - pattern: flask.send_file($P, ...)
              - pattern: FileResponse($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: safe_join(...)
      - pattern: werkzeug.utils.safe_join(...)
      - pattern: int(...)
      - pattern: uuid.UUID(...)

  # XXE: an XML parser configured to resolve external entities. The standard library's parsers do not
  # fetch them; lxml and SAX do when asked to. Advisory: the configuration is the risk, whatever the
  # input turns out to be.
  - id: python-xxe
    languages: [python]
    severity: WARNING
    message: an XML parser is configured to resolve external entities
    metadata: { category: XXE }
    pattern-either:
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: lxml.etree.XMLParser(..., no_network=False, ...)
      - pattern: etree.XMLParser(..., no_network=False, ...)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)
      - pattern: $P.setFeature(feature_external_ges, True)
