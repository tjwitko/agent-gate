# Injection and credential rules for C#, written for agent-gate. See python.yaml for the split between
# blocking taint rules (ERROR) and advisory pattern rules (WARNING). Sources are ASP.NET Core: the
# HttpRequest, the parameters of attribute-routed actions, and minimal-API handler parameters.
rules:
  - id: csharp-command-injection
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: request data reaches a shell command
    metadata: { category: command injection }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query
          - pattern: Request.Form
          - pattern: Request.Headers
          - pattern: Request.Cookies
          - pattern: Request.RouteValues
          - pattern: Request.Body
          - pattern: Request.QueryString
          - pattern: $CTX.Request.$X
      # ASP.NET Core actions: a parameter of an attribute-routed method is bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  [$A(...)]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A(...)]
                  public async $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public async $R $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(Http(Get|Post|Put|Patch|Delete)|Route)$
          - pattern: $P
      # Minimal APIs: app.MapGet("/x", (string host) => ...).
      - patterns:
          - pattern-inside: $APP.$MAP($ROUTE, (..., $T $P, ...) => $BODY)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Process.Start($SH, $ARGS)
              - pattern: System.Diagnostics.Process.Start($SH, $ARGS)
              - pattern: new ProcessStartInfo($SH, $ARGS)
              - pattern: new System.Diagnostics.ProcessStartInfo($SH, $ARGS)
          - metavariable-regex:
              metavariable: $SH
              regex: ^"(cmd|cmd\.exe|sh|bash|/bin/sh|/bin/bash|powershell|powershell\.exe|pwsh)"$
          - focus-metavariable: $ARGS

  - id: csharp-sql-injection
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: request data is built into a SQL statement
    metadata: { category: SQL injection }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query
          - pattern: Request.Form
          - pattern: Request.Headers
          - pattern: Request.Cookies
          - pattern: Request.RouteValues
          - pattern: Request.Body
          - pattern: Request.QueryString
          - pattern: $CTX.Request.$X
      # ASP.NET Core actions: a parameter of an attribute-routed method is bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  [$A(...)]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A(...)]
                  public async $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public async $R $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(Http(Get|Post|Put|Patch|Delete)|Route)$
          - pattern: $P
      # Minimal APIs: app.MapGet("/x", (string host) => ...).
      - patterns:
          - pattern-inside: $APP.$MAP($ROUTE, (..., $T $P, ...) => $BODY)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new $CMD($Q, ...)
              - pattern: $C.CommandText = $Q
              - pattern: $DB.Database.ExecuteSqlRaw($Q, ...)
              - pattern: $DB.Database.ExecuteSqlRawAsync($Q, ...)
              - pattern: $DB.Database.SqlQueryRaw<$T>($Q, ...)
              - pattern: $SET.FromSqlRaw($Q, ...)
          - metavariable-regex:
              metavariable: $CMD
              regex: ^(SqlCommand|SqliteCommand|NpgsqlCommand|MySqlCommand|OracleCommand|OleDbCommand|OdbcCommand)$
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $DB.Database.ExecuteSqlRaw($Q, ...)
              - pattern: $DB.Database.ExecuteSqlRawAsync($Q, ...)
              - pattern: $SET.FromSqlRaw($Q, ...)
              - pattern: $C.CommandText = $Q
          - focus-metavariable: $Q
      # EF Core's FromSql: a string is concatenated, an interpolated string written inline is turned into
      # parameters. dvcsharp-api's "Search Product" (A1, Injection) builds the string first and passes
      # the variable, which the sink list missed until this was added.
      - patterns:
          - pattern-either:
              - pattern: $SET.FromSql($Q, ...)
              - pattern: $DB.Database.ExecuteSqlCommand($Q, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!\$@?").*
          - focus-metavariable: $Q
      # Dapper, on a connection.
      - patterns:
          - pattern: $CONN.$M($Q, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Query|QueryAsync|QueryFirst|QueryFirstOrDefault|QuerySingle|QuerySingleOrDefault|QueryMultiple|Execute|ExecuteAsync|ExecuteScalar|ExecuteScalarAsync|ExecuteReader)$
          - metavariable-regex:
              metavariable: $CONN
              regex: (?i).*(conn|connection|db|cnn)$
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: int.Parse(...)
      - pattern: long.Parse(...)
      - pattern: Guid.Parse(...)
      - pattern: Convert.ToInt32(...)

  - id: csharp-code-injection
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: request data is evaluated as code
    metadata: { category: code injection }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query
          - pattern: Request.Form
          - pattern: Request.Headers
          - pattern: Request.Cookies
          - pattern: Request.RouteValues
          - pattern: Request.Body
          - pattern: Request.QueryString
          - pattern: $CTX.Request.$X
      # ASP.NET Core actions: a parameter of an attribute-routed method is bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  [$A(...)]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A(...)]
                  public async $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public async $R $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(Http(Get|Post|Put|Patch|Delete)|Route)$
          - pattern: $P
      # Minimal APIs: app.MapGet("/x", (string host) => ...).
      - patterns:
          - pattern-inside: $APP.$MAP($ROUTE, (..., $T $P, ...) => $BODY)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: CSharpScript.EvaluateAsync($X, ...)
              - pattern: CSharpScript.RunAsync($X, ...)
              - pattern: Type.GetType($X, ...)
          - focus-metavariable: $X

  # SSRF: a fixed scheme and host with request data only after the first path slash is a sanitizer.
  # Building a Uri connects to nothing, so the sink is the request.
  - id: csharp-ssrf
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: request data chooses where the server sends a request
    metadata: { category: SSRF }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query
          - pattern: Request.Form
          - pattern: Request.Headers
          - pattern: Request.Cookies
          - pattern: Request.RouteValues
          - pattern: Request.Body
          - pattern: Request.QueryString
          - pattern: $CTX.Request.$X
      # ASP.NET Core actions: a parameter of an attribute-routed method is bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  [$A(...)]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A(...)]
                  public async $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public async $R $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(Http(Get|Post|Put|Patch|Delete)|Route)$
          - pattern: $P
      # Minimal APIs: app.MapGet("/x", (string host) => ...).
      - patterns:
          - pattern-inside: $APP.$MAP($ROUTE, (..., $T $P, ...) => $BODY)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $HC.$M($URL, ...)
              - pattern: WebRequest.Create($URL)
              - pattern: new HttpRequestMessage($VERB, $URL)
          - metavariable-regex:
              metavariable: $M
              regex: ^(GetAsync|GetStringAsync|GetStreamAsync|GetByteArrayAsync|PostAsync|PostAsJsonAsync|PutAsync|PutAsJsonAsync|PatchAsync|DeleteAsync|DownloadString|DownloadData|DownloadFile|OpenRead)$
          # The receiver must be an HTTP client. These are also the names of every async service and
          # repository method: Bitwarden's _cipherService.DeleteAsync(id) was 30 blocking "SSRF"s.
          - metavariable-regex:
              metavariable: $HC
              regex: (?i)^_?\w*(http|client|webclient|wc)\w*$
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: WebRequest.Create($URL)
              - pattern: new HttpRequestMessage($VERB, $URL)
          - focus-metavariable: $URL
    pattern-sanitizers:
      # A record looked up by a request value is server data: Jellyfin serves item.Path for
      # _libraryManager.GetItemById(itemId). Only service-like receivers, so Path.Combine and
      # File.ReadAllText still carry taint.
      - patterns:
          - pattern-either:
              - pattern: $S.$M(...)
              - pattern: $S.$M<$T>(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Get|Find|Load|Fetch|Lookup|Retrieve|Read)\w*(Async)?$
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^_?\w*(manager|service|repository|repo|store|provider|context|dbcontext|db)$
      # A controller's own Get... helper, which does the lookup itself (Jellyfin's
      # GetGraphicalSubtitlePath(itemId, ...)). Bare calls only: Path.GetFullPath keeps its receiver.
      - patterns:
          - pattern-either:
              - pattern: $M(...)
              - pattern: await $M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^Get[A-Z]\w*(Async)?$
      - patterns:
          - pattern-either:
              - pattern: '"$P" + $X'
              - pattern: string.Format("$P", ...)
          - metavariable-regex:
              metavariable: $P
              regex: ^https?://[^/{}]+/
      - pattern-regex: \$@?"https?://[^/{"]+/[^"]*"
      # A relative URL with a fixed first segment stays on the client's fixed base address: Bitwarden's
      # httpClient.GetAsync($"/Account/PreValidate?domainHint={hint}") cannot leave its host.
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: $P
              regex: ^/[^/]
      - pattern-regex: \$@?"/[^/"{][^"]*"

  # Path traversal: Path.Combine does not stop "../" -- and an absolute second argument replaces the
  # first -- so only Path.GetFileName is a sanitizer.
  - id: csharp-path-traversal
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: request data names a file the server reads, writes or deletes
    metadata: { category: path traversal }
    pattern-sources:
      - pattern-either:
          - pattern: Request.Query
          - pattern: Request.Form
          - pattern: Request.Headers
          - pattern: Request.Cookies
          - pattern: Request.RouteValues
          - pattern: Request.Body
          - pattern: Request.QueryString
          - pattern: $CTX.Request.$X
      # ASP.NET Core actions: a parameter of an attribute-routed method is bound from the request.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  [$A(...)]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A(...)]
                  public async $R $M(..., $T $P, ...) { ... }
              - pattern-inside: |
                  [$A]
                  public async $R $M(..., $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(Http(Get|Post|Put|Patch|Delete)|Route)$
          - pattern: $P
      # Minimal APIs: app.MapGet("/x", (string host) => ...).
      - patterns:
          - pattern-inside: $APP.$MAP($ROUTE, (..., $T $P, ...) => $BODY)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete)$
          - pattern: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File.$M($P, ...)
              - pattern: System.IO.File.$M($P, ...)
              - pattern: Directory.Delete($P, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(ReadAllText|ReadAllTextAsync|ReadAllBytes|ReadAllBytesAsync|ReadAllLines|ReadLines|OpenRead|OpenWrite|OpenText|Open|Create|WriteAllText|WriteAllTextAsync|WriteAllBytes|WriteAllBytesAsync|AppendAllText|Delete|Copy|Move)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: new FileStream($P, ...)
              - pattern: new StreamReader((string $P), ...)
              - pattern: new StreamWriter((string $P), ...)
              - pattern: PhysicalFile($P, ...)
              - pattern: Directory.Delete($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      # A record looked up by a request value is server data: Jellyfin serves item.Path for
      # _libraryManager.GetItemById(itemId). Only service-like receivers, so Path.Combine and
      # File.ReadAllText still carry taint.
      - patterns:
          - pattern-either:
              - pattern: $S.$M(...)
              - pattern: $S.$M<$T>(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Get|Find|Load|Fetch|Lookup|Retrieve|Read)\w*(Async)?$
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^_?\w*(manager|service|repository|repo|store|provider|context|dbcontext|db)$
      # A controller's own Get... helper, which does the lookup itself (Jellyfin's
      # GetGraphicalSubtitlePath(itemId, ...)). Bare calls only: Path.GetFullPath keeps its receiver.
      - patterns:
          - pattern-either:
              - pattern: $M(...)
              - pattern: await $M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^Get[A-Z]\w*(Async)?$
      - pattern: Path.GetFileName(...)
      - pattern: System.IO.Path.GetFileName(...)
      - pattern: int.Parse(...)
      - pattern: Guid.Parse(...)

  # XXE: .NET's XML readers resolve external entities when DTD processing is on or a resolver is set.
  - id: csharp-xxe
    languages: [csharp]
    severity: WARNING
    message: an XML parser is configured to resolve external entities
    metadata: { category: XXE }
    pattern-either:
      - pattern: $S.DtdProcessing = DtdProcessing.Parse
      - pattern: '$S.XmlResolver = new XmlUrlResolver()'
      - pattern: 'new XmlReaderSettings { ..., DtdProcessing = DtdProcessing.Parse, ... }'
      - pattern: 'new XmlDocument { ..., XmlResolver = new XmlUrlResolver(), ... }'

  - id: csharp-sql-string-built
    languages: [csharp]
    severity: WARNING
    message: a SQL statement is built by concatenation or interpolation rather than passed parameters
    metadata: { category: SQL injection }
    patterns:
      - pattern-either:
          - pattern: new $CMD("..." + $X, ...)
          - pattern: new $CMD($X + "...", ...)
          - pattern: $C.CommandText = "..." + $X
          - pattern: $C.CommandText = $X + "..."
          - pattern: $DB.Database.ExecuteSqlRaw("..." + $X, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: ^(SqlCommand|SqliteCommand|NpgsqlCommand|MySqlCommand|OracleCommand|OleDbCommand|OdbcCommand)$

  - id: csharp-shell-nonliteral
    languages: [csharp]
    severity: WARNING
    message: a shell command is built from a value that is not a literal
    metadata: { category: command injection }
    patterns:
      - pattern-either:
          - pattern: Process.Start($SH, $ARGS)
          - pattern: System.Diagnostics.Process.Start($SH, $ARGS)
          - pattern: new ProcessStartInfo($SH, $ARGS)
      - metavariable-regex:
          metavariable: $SH
          regex: ^"(cmd|cmd\.exe|sh|bash|/bin/sh|/bin/bash|powershell|powershell\.exe|pwsh)"$
      - metavariable-pattern:
          metavariable: $ARGS
          patterns:
            - pattern: $Y
            - pattern-not: '"..."'
      - focus-metavariable: $ARGS

  # SQL text built from a value is reported where it is built, whichever method later runs it.
  - id: csharp-sql-text-built
    languages: [csharp]
    severity: WARNING
    message: SQL text is built from a value, wherever it is later executed
    metadata: { category: SQL injection }
    pattern-either:
      - patterns:
          - pattern: '"$SQL" + $X'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)
          - metavariable-pattern:
              metavariable: $X
              patterns:
                - pattern: $Y
                - pattern-not: '"..."'
      - patterns:
          - pattern: string.Format("$SQL", ...)
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select\s.+\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)
      # Interpolated strings, matched as text.
      - patterns:
          - pattern-regex: (?is)\$@?"\s*(?:select\s[^"]*?\sfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b)[^"]*?\{
          - pattern-not-regex: (?m)^[ \t]*(//|/\*|\*).*$
          # EF Core turns each interpolation into a parameter in these: the safe spelling, not this.
          - pattern-not-inside: $X.FromSqlInterpolated(...)
          - pattern-not-inside: $X.FromSql(...)
          - pattern-not-inside: $X.ExecuteSqlInterpolated(...)
          - pattern-not-inside: $X.ExecuteSqlInterpolatedAsync(...)
          - pattern-not-inside: $X.SqlQuery<$T>(...)
          - pattern-not-inside: $X.Database.SqlQuery<$T>(...)

  # A credential assembled from literals is still in the source; see python.yaml.
  - id: csharp-assembled-credential
    languages: [csharp]
    severity: ERROR
    message: a credential is assembled from literals in the source
    metadata: { category: hardcoded credential }
    options:
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: 'string $V = "$A" + "$B";'
          - pattern: 'string $V = "$A" + "$B" + "$C";'
          - pattern: 'string $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: 'string $V = string.Concat("$A", ...);'
          - pattern: 'string $V = string.Join($SEP, "$A", ...);'
          - pattern: 'string $V = <... Convert.FromBase64String("$A") ...>;'
          - pattern: 'var $V = "$A" + "$B";'
          - pattern: 'var $V = "$A" + "$B" + "$C";'
          - pattern: 'var $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: 'var $V = string.Concat("$A", ...);'
          - pattern: 'var $V = string.Join($SEP, "$A", ...);'
          - pattern: 'var $V = <... Convert.FromBase64String("$A") ...>;'
          - pattern: '$V = "$A" + "$B";'
          - pattern: '$V = "$A" + "$B" + "$C";'
          - pattern: '$V = "$A" + "$B" + "$C" + "$D";'
          - pattern: '$V = string.Concat("$A", ...);'
          - pattern: '$V = string.Join($SEP, "$A", ...);'
          - pattern: '$V = <... Convert.FromBase64String("$A") ...>;'
          - pattern: 'const string $V = "$A" + "$B";'
          - pattern: 'const string $V = "$A" + "$B" + "$C";'
          - pattern: 'const string $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: 'const string $V = string.Concat("$A", ...);'
          - pattern: 'const string $V = string.Join($SEP, "$A", ...);'
          - pattern: 'const string $V = <... Convert.FromBase64String("$A") ...>;'
          - pattern: 'private const string $V = "$A" + "$B";'
          - pattern: 'private const string $V = "$A" + "$B" + "$C";'
          - pattern: 'private const string $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: 'private const string $V = string.Concat("$A", ...);'
          - pattern: 'private const string $V = string.Join($SEP, "$A", ...);'
          - pattern: 'private const string $V = <... Convert.FromBase64String("$A") ...>;'
          - pattern: 'private static readonly string $V = "$A" + "$B";'
          - pattern: 'private static readonly string $V = "$A" + "$B" + "$C";'
          - pattern: 'private static readonly string $V = "$A" + "$B" + "$C" + "$D";'
          - pattern: 'private static readonly string $V = string.Concat("$A", ...);'
          - pattern: 'private static readonly string $V = string.Join($SEP, "$A", ...);'
          - pattern: 'private static readonly string $V = <... Convert.FromBase64String("$A") ...>;'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^.*?(api_?key|access_?key|secret(_?key)?|signing_?key|private_?key|token|passw(or)?d|pwd|passphrase|credentials?)$
      - metavariable-regex:
          metavariable: $V
          regex: ^\S+$
      - pattern-not-regex: (["'])[^"'\n]*\s[^"'\n]*\1\s*\+|\+\s*(["'])[^"'\n]*\s[^"'\n]*\2
