# Injection rules for Ruby (Rails, Sinatra), written for agent-gate. See python.yaml for the split
# between blocking taint rules (ERROR) and advisory pattern rules (WARNING).
#
# Measured against Semgrep's Ruby matching before being written: `system($X)` matches the
# single-string form only, so `system("ping", host)` -- no shell -- is never a sink; and
# `$M.where($Q, ...)` does not match the keyword form `where(name: params[:n])`, which Rails
# parameterises.
rules:
  - id: ruby-command-injection
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: request data reaches a shell command
    metadata: { category: command injection }
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: request.params
          - pattern: request.query_parameters
          - pattern: request.request_parameters
          - pattern: request.headers
          - pattern: request.body
          - pattern: request.raw_post
          - pattern: cookies
    pattern-sinks:
      - pattern-either:
          # Backticks and %x() run their string through a shell; the expression is the sink.
          - pattern: "`...`"
          - patterns:
              - pattern-either:
                  - pattern: system($CMD)
                  - pattern: Kernel.system($CMD)
                  - pattern: exec($CMD)
                  - pattern: spawn($CMD)
                  - pattern: IO.popen($CMD, ...)
                  - pattern: Open3.capture2($CMD, ...)
                  - pattern: Open3.capture2e($CMD, ...)
                  - pattern: Open3.capture3($CMD, ...)
                  - pattern: Open3.popen3($CMD, ...)
              - focus-metavariable: $CMD

  - id: ruby-sql-injection
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: request data is built into a SQL statement
    metadata: { category: SQL injection }
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: request.params
          - pattern: request.query_parameters
          - pattern: request.request_parameters
          - pattern: request.headers
          - pattern: request.body
          - pattern: request.raw_post
          - pattern: cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $M.find_by_sql($Q, ...)
              - pattern: $M.where($Q, ...)
              - pattern: $M.order($Q, ...)
              - pattern: $M.reorder($Q, ...)
              - pattern: $M.group($Q, ...)
              - pattern: $M.having($Q, ...)
              - pattern: $M.joins($Q, ...)
              - pattern: $M.select($Q, ...)
              - pattern: $M.pluck($Q, ...)
              - pattern: $M.count_by_sql($Q, ...)
              - pattern: $C.execute($Q, ...)
              - pattern: $C.exec_query($Q, ...)
              - pattern: $C.select_all($Q, ...)
              - pattern: $C.select_one($Q, ...)
              - pattern: $C.select_value($Q, ...)
              - pattern: $C.select_rows($Q, ...)
          - focus-metavariable: $Q
          # A hash or array argument is bound by Rails, not concatenated.
          - pattern-not: "{...}"
          - pattern-not: "[...]"
    pattern-sanitizers:
      - pattern: $X.to_i
      - pattern: Integer(...)
      - pattern: $C.quote(...)
      - pattern: ActiveRecord::Base.sanitize_sql(...)
      - pattern: $M.sanitize_sql_array(...)

  - id: ruby-code-injection
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: request data is evaluated as code
    metadata: { category: code injection }
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: request.params
          - pattern: request.body
          - pattern: request.raw_post
          - pattern: cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: $O.instance_eval($X, ...)
              - pattern: $O.class_eval($X, ...)
              - pattern: $O.module_eval($X, ...)
              - pattern: Marshal.load($X, ...)
              - pattern: YAML.load($X, ...)
              - pattern: Object.const_get($X, ...)
              - pattern: $O.send($X, ...)
              - pattern: $O.public_send($X, ...)
          - focus-metavariable: $X
      - pattern: $X.constantize

  - id: ruby-sql-string-built
    languages: [ruby]
    severity: WARNING
    message: a SQL statement is built by string interpolation or concatenation rather than passed parameters
    metadata: { category: SQL injection }
    patterns:
      - pattern-either:
          - pattern: $M.$METHOD("...#{$X}...", ...)
          - pattern: $M.$METHOD("..." + $X, ...)
          - pattern: $M.$METHOD($X + "...", ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(find_by_sql|where|order|reorder|group|having|joins|count_by_sql|execute|exec_query|select_all|select_one|select_value|select_rows)$

  - id: ruby-shell-nonliteral
    languages: [ruby]
    severity: WARNING
    message: a shell command is built from a value that is not a literal
    metadata: { category: command injection }
    pattern-either:
      - pattern: "`...#{$X}...`"
      - pattern: system("...#{$X}...")
      - pattern: system("..." + $X)
      - pattern: system($X + "...")
      - pattern: exec("...#{$X}...")
      - pattern: IO.popen("...#{$X}...", ...)
      - pattern: Open3.capture2("...#{$X}...", ...)
      - pattern: Open3.capture3("...#{$X}...", ...)

  # See java.yaml's java-sql-text-built: a query built into a variable in one method and executed in
  # another is not followed by taint, so SQL text with an interpolation is reported where it is built.
  - id: ruby-sql-text-built
    languages: [ruby]
    severity: WARNING
    message: SQL text is built by interpolation, wherever it is later executed
    metadata: { category: SQL injection }
    patterns:
      - pattern-regex: (?is)"\s*(select\s[^"]*\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from)\b[^"]*#\{
      # A regex reads raw text, so a commented-out query would match; one did, in rubygems.org.
      - pattern-not-regex: (?m)^[ \t]*#.*$

  # A credential assembled from literals is still in the source, just not as one string, so
  # gitleaks -- which reads literals -- does not see it. Matched by the shape of the assembly and the
  # name it is assigned to; the name has to END like a credential, so TOKEN_URL and password_field
  # are left alone. Blocks: every piece of the value is written in the file. Each assignment form is
  # spelled out with each shape, because Semgrep would not match the shapes as sub-patterns of a
  # bound value. The name pattern starts with `.*?` because metavariable-regex anchors at the START:
  # without it only names beginning with a credential word matched, which looked like the shapes failing.
  - id: ruby-assembled-credential
    languages: [ruby]
    severity: ERROR
    message: a credential is assembled from literals in the source
    metadata: { category: hardcoded credential }
    # Only literals as written. With constant propagation a variable holding a test password, plus
    # ' this makes the password wrong', counted as two literals: Juice Shop's 2FA test matched.
    options:
      constant_propagation: false
    patterns:
      - pattern-either:
          - pattern: '$V = "$A" + "$B"'
          - pattern: '$V = "$A" + "$B" + "$C"'
          - pattern: '$V = "$A" + "$B" + "$C" + "$D"'
          - pattern: '$V = [...].join'
          - pattern: '$V = [...].join(...)'
          - pattern: '$V = <... Base64.decode64("$A") ...>'
          - pattern: '$V = <... Base64.strict_decode64("$A") ...>'
          - pattern: '$V = "$A".reverse'
          - pattern: '{..., $V: "$A" + "$B", ...}'
          - pattern: '{..., $V: "$A" + "$B" + "$C", ...}'
          - pattern: '{..., $V: "$A" + "$B" + "$C" + "$D", ...}'
          - pattern: '{..., $V: [...].join, ...}'
          - pattern: '{..., $V: [...].join(...), ...}'
          - pattern: '{..., $V: <... Base64.decode64("$A") ...>, ...}'
          - pattern: '{..., $V: <... Base64.strict_decode64("$A") ...>, ...}'
          - pattern: '{..., $V: "$A".reverse, ...}'
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^.*?(api_?key|access_?key|secret(_?key)?|signing_?key|private_?key|token|passw(or)?d|pwd|passphrase|credentials?)$
      # A credential has no whitespace; prose does. The remedy text for this very category -- a key named
      # "hardcoded credential" holding two concatenated sentences -- matched until this was added.
      - metavariable-regex:
          metavariable: $V
          regex: ^\S+$
      - pattern-not-regex: (["'])[^"'\n]*\s[^"'\n]*\1\s*\+|\+\s*(["'])[^"'\n]*\s[^"'\n]*\2

  # SSRF: request data choosing where the server connects. A fixed scheme and host with request data
  # only after the first path slash cannot be redirected, so that construction is a sanitizer.
  - id: ruby-ssrf
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: request data chooses where the server sends a request
    metadata: { category: SSRF }
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: request.params
          - pattern: request.query_parameters
          - pattern: request.request_parameters
          - pattern: request.headers
          - pattern: request.body
          - pattern: request.raw_post
          - pattern: cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              # The request, not URI(...): parsing a URL connects to nothing.
              - pattern: Net::HTTP.get($URL, ...)
              - pattern: Net::HTTP.get_response($URL, ...)
              - pattern: Net::HTTP.start($URL, ...)
              - pattern: URI.open($URL, ...)
              - pattern: HTTParty.$M($URL, ...)
              - pattern: Faraday.$M($URL, ...)
              - pattern: RestClient.$M($URL, ...)
              - pattern: Excon.$M($URL, ...)
          - focus-metavariable: $URL
    pattern-sanitizers:
      - patterns:
          - pattern: '"$P" + $X'
          - metavariable-regex:
              metavariable: $P
              regex: ^https?://[^/]+/
      - pattern-regex: '"https?://[^/#"]+/[^"]*"'

  # Path traversal: request data naming a file the server opens, sends, writes or deletes. File.join
  # does not stop "../"; File.basename does. Kernel#open is here too: given request data it can also
  # run a command ("|cmd") or fetch a URL, so taint reaching it is serious whatever it is called.
  - id: ruby-path-traversal
    mode: taint
    languages: [ruby]
    severity: ERROR
    message: request data names a file the server reads, writes or deletes
    metadata: { category: path traversal }
    pattern-sources:
      - pattern-either:
          - pattern: params
          - pattern: request.params
          - pattern: request.query_parameters
          - pattern: request.request_parameters
          - pattern: request.headers
          - pattern: request.body
          - pattern: request.raw_post
          - pattern: cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File.open($P, ...)
              - pattern: File.new($P, ...)
              - pattern: File.read($P, ...)
              - pattern: File.readlines($P, ...)
              - pattern: File.write($P, ...)
              - pattern: File.delete($P, ...)
              - pattern: File.unlink($P, ...)
              - pattern: IO.read($P, ...)
              - pattern: IO.readlines($P, ...)
              - pattern: FileUtils.rm($P, ...)
              - pattern: FileUtils.rm_rf($P, ...)
              - pattern: Pathname.new($P)
              - pattern: send_file($P, ...)
              - pattern: open($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: File.basename(...)
      - pattern: $X.to_i
      - pattern: Integer(...)

  # XXE: Nokogiri substitutes entities, and loads external DTDs, only when asked to.
  - id: ruby-xxe
    languages: [ruby]
    severity: WARNING
    message: an XML parser is configured to resolve external entities
    metadata: { category: XXE }
    pattern-either:
      - pattern: $C.noent
      - pattern: $C.dtdload
      - pattern: Nokogiri::XML::ParseOptions::NOENT
      - pattern: Nokogiri::XML::ParseOptions::DTDLOAD
